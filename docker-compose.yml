services:
  backend:
    build: ./backend
    container_name: job_radar_backend
    restart: unless-stopped
    ports:
      - "8888:8000"
    volumes:
      - ./data:/app/../data
      - ./backend:/app
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JOBSPIPE_API_KEY=${JOBSPIPE_API_KEY}
      - DATABASE_URL=sqlite:///../data/db/radar.sqlite3
    command: sh -c "python poller.py & uvicorn main:app --host 0.0.0.0 --port 8000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"


  frontend:
    build: ./frontend
    container_name: job_radar_frontend
    restart: unless-stopped
    ports:
      - "3333:80"
    depends_on:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

